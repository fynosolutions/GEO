<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restaurant JSON Collector</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/style.css"><script type="module" src="/js/main.js"></script></head>
<body><header class="header"><a class="brand" href="/">GEO Check</a><span>Local collection test</span></header><main>
<section class="hero"><h1>Restaurant JSON Collector</h1><p class="intro">Collect Google Maps, Yelp, Tripadvisor, OpenTable, DoorDash, Uber Eats, Grubhub and Facebook into one file for your downstream system.</p>
<form id="check-form"><label for="input-kind">Input type</label><select id="input-kind"><option value="name">Restaurant name or website</option><option value="place_id">Google place ID</option></select>
<label for="website">Restaurant name, website or Google place ID</label><div class="input-row"><input id="website" type="text" required maxlength="500" placeholder="Restaurant name"><button id="submit-button" type="submit"><span id="button-label">Collect JSON</span></button></div>
<label for="target-address">Branch address (recommended for chains)</label><input id="target-address" maxlength="500" placeholder="Full street address">
<p id="form-note" class="form-note">The output file is saved to out/&lt;restaurant-name&gt;.json. This page is a local test interface.</p></form><div id="result" role="status" hidden></div></section></main></body></html>

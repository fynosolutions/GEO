# Explicit, temporary real acceptance through a localhost-only SSH tunnel.
# Do not start the proxy while this override is active.
services:
  web:
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      APP_URL: http://localhost:3010
      AUDIT_TRUST_PROXY: "0"
      PUBLIC_AUDIT_ENABLED: "1"
      PUBLIC_AUDIT_LIVE_CALLS_ENABLED: "1"
      AUDIT_SHARED_BUDGET_ENABLED: "1"
  audit-worker:
    environment:
      APP_URL: http://localhost:3010
      PUBLIC_AUDIT_ENABLED: "1"
      PUBLIC_AUDIT_LIVE_CALLS_ENABLED: "1"
      AUDIT_SHARED_BUDGET_ENABLED: "1"
